<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard El Lucero</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #F4F6F8;
    --surface:      #FFFFFF;
    --surface2:     #EEF1F4;
    --border:       #DDE2E8;
    --border-soft:  #EEF1F4;
    --brand:        #005363;
    --brand-mid:    #006f85;
    --brand-light:  #e6f2f4;
    --brand-xlight: #f0f8f9;
    --text:         #111827;
    --text-mid:     #374151;
    --muted:        #5A6A7A;
    --green:        #0E9E6E;
    --green-bg:     #EDFAF4;
    --red:          #D94040;
    --red-bg:       #FEF0F0;
    --amber:        #B45309;
    --amber-bg:     #FFFBEB;
    --shadow-sm:    0 1px 3px rgba(0,83,99,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md:    0 4px 16px rgba(0,83,99,.08), 0 2px 4px rgba(0,0,0,.04);
    --radius:       12px;
    --radius-sm:    8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  /* ── HEADER ── */
  header {
    background: var(--brand);
    padding: 0 32px;
    height: 60px;
    display: flex; align-items: center; gap: 20px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  .header-logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none;
  }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  header h1 {
    font-size: 15px; font-weight: 600;
    color: #fff; white-space: nowrap; letter-spacing: -.01em;
  }
  header .divider {
    width: 1px; height: 24px;
    background: rgba(255,255,255,.2); flex-shrink: 0;
  }
  header span.year {
    font-size: 12px; color: rgba(255,255,255,.6);
    font-weight: 400;
  }

  /* ── FILTERS ── */
  .filters { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .filter-group { display: flex; align-items: center; gap: 6px; position: relative; }
  label {
    font-size: 11px; color: rgba(255,255,255,.65);
    text-transform: uppercase; letter-spacing: .06em; font-weight: 500;
  }

  /* Multiselect */
  .ms-trigger {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    padding: 6px 12px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
    min-width: 180px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    user-select: none; transition: all .15s; font-family: 'DM Sans', sans-serif;
  }
  .ms-trigger:hover { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.35); }
  .ms-trigger.open { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.4); }
  .ms-trigger .ms-arrow { font-size: 9px; color: rgba(255,255,255,.6); transition: transform .2s; }
  .ms-trigger.open .ms-arrow { transform: rotate(180deg); }
  .ms-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    min-width: 220px; z-index: 999; box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .ms-dropdown.open { display: block; }
  .ms-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border-soft);
    display: flex; gap: 8px; background: var(--surface2);
  }
  .ms-btn {
    font-size: 11px; color: var(--brand-mid); cursor: pointer; background: none; border: none;
    padding: 2px 8px; border-radius: 4px; font-weight: 500; font-family: 'DM Sans', sans-serif;
    transition: background .1s;
  }
  .ms-btn:hover { background: var(--brand-light); }
  .ms-list { max-height: 260px; overflow-y: auto; padding: 4px 0; }
  .ms-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 14px; cursor: pointer;
    font-size: 12px; transition: background .1s; color: var(--text);
  }
  .ms-item:hover { background: var(--brand-xlight); }
  .ms-item input[type=checkbox] { accent-color: var(--brand-mid); width: 13px; height: 13px; cursor: pointer; }

  /* Download button */
  .btn-download {
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); color: #fff;
    padding: 6px 14px; border-radius: var(--radius-sm); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: all .15s; font-family: 'DM Sans', sans-serif; font-weight: 500;
  }
  .btn-download:hover { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.4); }

  /* Tabs */
  .tabs { display: flex; gap: 2px; background: rgba(0,0,0,.15); padding: 3px; border-radius: var(--radius-sm); }
  .tab {
    padding: 5px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,.65); border: none; background: transparent; transition: all .15s;
    font-family: 'DM Sans', sans-serif;
  }
  .tab.active { background: #fff; color: var(--brand); font-weight: 600; }

  /* ── LAYOUT ── */
  main { padding: 24px 32px; }

  /* ── KPI CARDS ── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    border-left: 3px solid var(--brand);
    transition: box-shadow .2s;
  }
  .kpi:hover { box-shadow: var(--shadow-md); }
  .kpi .kpi-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 8px; font-weight: 600;
  }
  .kpi .kpi-val { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--text); }
  .kpi .kpi-val.pos { color: var(--green); }
  .kpi .kpi-val.neg { color: var(--red); }
  .kpi .kpi-val.neutral { color: var(--brand); }
  .kpi .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── CHART PANELS ── */
  .chart-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .chart-panel h2 {
    font-size: 11px; font-weight: 600; color: var(--muted);
    margin-bottom: 16px; text-transform: uppercase; letter-spacing: .08em;
  }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .chart-row { grid-template-columns: 1fr; } }
  .chart-wrap { position: relative; height: 220px; }

  #breakdown-row-inner { display: grid; grid-template-columns: 1fr; gap: 20px; }
  #breakdown-row-inner.side-by-side { grid-template-columns: 1fr 1fr; }
  .chart-subpanel { display: flex; flex-direction: column; }
  .chart-subpanel-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    text-align: center; margin-bottom: 6px;
  }

  /* ── TABLE ── */
  .table-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .table-panel h2 {
    font-size: 13px; font-weight: 600; color: var(--text);
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    letter-spacing: -.01em;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    background: var(--surface2); color: #3D4F5F; font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em;
    padding: 10px 14px; white-space: nowrap;
    border-bottom: 2px solid var(--border);
    text-align: center;
  }
  th:first-child { text-align: left; }
  td {
    padding: 7px 14px; text-align: right;
    border-bottom: 1px solid var(--border-soft);
    white-space: nowrap; color: var(--text);
  }
  td:first-child { text-align: left; }
  tr:hover td { background: var(--brand-xlight); }

  /* Row types */
  tr.group-header td {
    background: var(--brand); color: #fff; font-weight: 700; font-size: 11px;
    text-transform: uppercase; letter-spacing: .07em; padding: 9px 14px;
  }
  tr.group-header.exp-header td:first-child { }
  tr.group-header.exp-header .sub-th {
    color: rgba(255,255,255,.75); font-size: 10px; letter-spacing: .05em;
    vertical-align: middle;
  }
  tr.subtotal td {
    background: var(--brand-light); font-weight: 700; color: #004050;
    border-top: 1px solid rgba(0,83,99,.15);
  }
  tr.result-op td {
    background: var(--amber-bg); font-weight: 700; color: #92400E;
    border-top: 1px solid #F5D89A;
  }
  tr.result-final td {
    font-weight: 800; font-size: 13px;
    border-top: 2px solid var(--border);
    background: var(--surface2);
  }
  tr.result-final td.pos { color: var(--green); }
  tr.result-final td.neg { color: var(--red); }
  tr.detail td:first-child { padding-left: 30px; color: #374151; }
  tr.perc td { font-style: italic; color: #005363; }

  .pos-num { color: var(--green); }
  .neg-num { color: var(--red); }
  .zero-num { color: #6B7A8D; }
  .muted-pct { color: #4A5D6E !important; font-size: 11px; font-style: italic; }
  .perc-cell { font-style: italic; }

  tr.subheader th { background: var(--surface2); color: var(--muted); font-size: 10px; }
  tr.col-subheader td, tr.col-subheader th { background: var(--brand-light); padding: 5px 10px; }
  .sub-th { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; text-align: right; font-weight: 700; color: #4A5D6E; }

  /* Month column tints */
  .m-even { background: rgba(0,83,99,.04); }
  .m-total { background: rgba(0,83,99,.07); }
  th.m-even { background: #d3e8ed; color: #004050; }
  th.m-total { background: #b8d8df; color: #003340; }
  th.m-even.sub-th { background: #e0eef1; }
  th.m-total.sub-th { background: #cce2e7; }
  td.m-start, th.m-start { border-left: 2px solid rgba(0,83,99,.2) !important; }
  th.th-concepto { vertical-align: middle; }

  /* View toggle */
  #view-tabla { display: block; }
  #view-graficos { display: none; }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <div class="logo-mark">✦</div>
    <h1>El Lucero</h1>
  </div>
  <div class="divider"></div>
  <span class="year">2026</span>
  <div class="filters">
    <div class="filter-group">
      <label>Meses</label>
      <div class="ms-trigger" id="ms-trigger-mes" onclick="toggleDropdownMes()">
        <span id="ms-label-mes">Todos los meses</span>
        <span class="ms-arrow">▼</span>
      </div>
      <div class="ms-dropdown" id="ms-dropdown-mes">
        <div class="ms-header">
          <button class="ms-btn" onclick="selectAllMes(event)">Todos</button>
          <button class="ms-btn" onclick="selectNoneMes(event)">Ninguno</button>
        </div>
        <div class="ms-list" id="ms-list-mes"></div>
      </div>
    </div>
    <div class="filter-group">
      <label>Tiendas</label>
      <div class="ms-trigger" id="ms-trigger" onclick="toggleDropdown()">
        <span id="ms-label">Todas las tiendas</span>
        <span class="ms-arrow">▼</span>
      </div>
      <div class="ms-dropdown" id="ms-dropdown">
        <div class="ms-header">
          <button class="ms-btn" onclick="selectAll(event)">Todas</button>
          <button class="ms-btn" onclick="selectNone(event)">Ninguna</button>
        </div>
        <div class="ms-list" id="ms-list"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setView('tabla')">Tabla</button>
      <button class="tab" onclick="setView('graficos')">Gráficos</button>
    </div>
    <button class="btn-download" id="btn-excel" onclick="downloadExcel()">⬇ Descargar tabla</button>
    <label class="btn-download" style="cursor:pointer" title="Cargar nuevo archivo de datos">
      ⬆ Cargar datos
      <input type="file" id="file-input" accept=".xlsx" style="display:none" onchange="handleFileUpload(this.files[0])">
    </label>
    <span id="upload-status" style="font-size:11px;color:rgba(255,255,255,.8);white-space:nowrap"></span>
  </div>
</header>

<main>
  <div class="kpis" id="kpis"></div>

  <div id="view-tabla">
    <div class="table-panel">
      <h2 id="table-title">Estado de Resultados</h2>
      <div class="table-scroll">
        <table id="pnl-table"></table>
      </div>
    </div>
  </div>

  <div id="view-graficos">
    <div class="chart-panel">
      <h2 id="chart-title">Comparativa por tienda</h2>
      <div class="chart-row">
        <div class="chart-wrap"><canvas id="chart-result"></canvas></div>
        <div class="chart-wrap"><canvas id="chart-margen"></canvas></div>
      </div>
    </div>
    <div class="chart-panel" id="panel-breakdown-row">
      <div id="breakdown-row-inner">
        <div class="chart-subpanel">
          <div class="chart-subpanel-title">Composición de egresos</div>
          <div class="chart-wrap" style="height:290px"><canvas id="chart-breakdown"></canvas></div>
        </div>
        <div class="chart-wrap" style="height:300px"><canvas id="chart-gastos-stack"></canvas></div>
      </div>
    </div>
  </div>
</main>

let TIENDAS = [];
let MESES = [];
const MESES_LABELS = {1:'Enero', 2:'Febrero', 3:'Marzo', 4:'Abril', 5:'Mayo', 6:'Junio', 7:'Julio', 8:'Agosto', 9:'Septiembre', 10:'Octubre', 11:'Noviembre', 12:'Diciembre'};

function computeLists() {
  TIENDAS = [...new Set(RAW.map(d => d.TIENDA))].sort();
  MESES   = [...new Set(RAW.map(d => d.MES))].sort((a,b)=>a-b);
}
computeLists();

// Multiselect state
let selectedTiendas = new Set(TIENDAS);
let selectedMeses   = new Set(MESES);

function buildTiendaFilter() {
  selectedTiendas = new Set(TIENDAS);
  const list = document.getElementById('ms-list');
  list.innerHTML = '';
  TIENDAS.forEach(t => {
    const item = document.createElement('label');
    item.className = 'ms-item';
    item.innerHTML = `<input type="checkbox" value="${t}" checked onchange="onCheck()"> ${t}`;
    list.appendChild(item);
  });
  updateLabel();
}

function buildMesFilter() {
  selectedMeses = new Set(MESES);
  const listMes = document.getElementById('ms-list-mes');
  listMes.innerHTML = '';
  MESES.forEach(m => {
    const item = document.createElement('label');
    item.className = 'ms-item';
    item.innerHTML = `<input type="checkbox" value="${m}" checked onchange="onCheckMes()"> ${MESES_LABELS[m]}`;
    listMes.appendChild(item);
  });
  updateLabelMes();
}

buildTiendaFilter();
buildMesFilter();

function updateLabel() {
  const n = selectedTiendas.size;
  document.getElementById('ms-label').textContent =
    n === 0 ? 'Ninguna seleccionada' :
    n === TIENDAS.length ? 'Todas las tiendas' :
    n === 1 ? [...selectedTiendas][0] :
    `${n} tiendas`;
}

function onCheck() {
  selectedTiendas = new Set(
    [...document.querySelectorAll('#ms-list input:checked')].map(c => c.value)
  );
  updateLabel();
  render();
}

function selectAll(e) { if(e) e.stopPropagation(); document.querySelectorAll('#ms-list input').forEach(c => c.checked = true); onCheck(); }
function selectNone(e) { if(e) e.stopPropagation(); document.querySelectorAll('#ms-list input').forEach(c => c.checked = false); onCheck(); }

function toggleDropdown() {
  document.getElementById('ms-trigger').classList.toggle('open');
  document.getElementById('ms-dropdown').classList.toggle('open');
}

function updateLabelMes() {
  const n = selectedMeses.size;
  document.getElementById('ms-label-mes').textContent =
    n === 0 ? 'Ninguno' :
    n === MESES.length ? 'Todos los meses' :
    n === 1 ? MESES_LABELS[[...selectedMeses][0]] :
    `${n} meses`;
}

function onCheckMes() {
  selectedMeses = new Set(
    [...document.querySelectorAll('#ms-list-mes input:checked')].map(c => Number(c.value))
  );
  updateLabelMes();
  render();
}

function selectAllMes(e) { if(e) e.stopPropagation(); document.querySelectorAll('#ms-list-mes input').forEach(c => c.checked = true); onCheckMes(); }
function selectNoneMes(e) { if(e) e.stopPropagation(); document.querySelectorAll('#ms-list-mes input').forEach(c => c.checked = false); onCheckMes(); }

function toggleDropdownMes() {

}

// ── CARGA DE ARCHIVO ─────────────────────────────────────────────────
function handleFileUpload(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
      if (!rows.length || !('TIENDA' in rows[0]) || !('CONCEPTO' in rows[0]) || !('TOTAL' in rows[0])) {
        showUploadStatus('⚠ El archivo no tiene el formato correcto (columnas: AÑO, MES, TIENDA, CONCEPTO, TOTAL)', true);
        return;
      }
      RAW = rows
        .filter(r => r.TIENDA && r.CONCEPTO)
        .map(r => ({
          AÑO:      parseInt(r.AÑO)      || 2026,
          MES:      parseInt(r.MES),
          TIENDA:   String(r.TIENDA).trim(),
          CONCEPTO: String(r.CONCEPTO).trim(),
          TOTAL:    parseFloat(r.TOTAL)  || 0
        }));
      computeLists();
      buildTiendaFilter();
      buildMesFilter();
      destroyCharts();
      render();
      showUploadStatus(`✓ ${rows.length} filas cargadas — ${TIENDAS.length} tiendas, meses ${MESES.map(m=>MESES_LABELS[m]).join(', ')}`);
    } catch(err) {
      showUploadStatus('⚠ Error al leer el archivo: ' + err.message, true);
    }
    // Reset input so the same file can be re-cargado si es necesario
    document.getElementById('file-input').value = '';
  };
  reader.readAsArrayBuffer(file);
}

function showUploadStatus(msg, isError = false) {
  const el = document.getElementById('upload-status');
  el.textContent = msg;
  el.style.color = isError ? '#f87171' : 'rgba(255,255,255,.85)';
  if (!isError) setTimeout(() => { el.textContent = ''; }, 5000);
}

document.addEventListener('click', e => {
  if (!document.getElementById('ms-trigger').contains(e.target) && !document.getElementById('ms-dropdown').contains(e.target)) {
    document.getElementById('ms-trigger').classList.remove('open');
    document.getElementById('ms-dropdown').classList.remove('open');
  }
  if (!document.getElementById('ms-trigger-mes').contains(e.target) && !document.getElementById('ms-dropdown-mes').contains(e.target)) {
    document.getElementById('ms-trigger-mes').classList.remove('open');
    document.getElementById('ms-dropdown-mes').classList.remove('open');
  }
});

// Helper: get value
function getVal(tiendas, mes, concepto) {
  return RAW.filter(d => tiendas.includes(d.TIENDA) && d.MES === mes && d.CONCEPTO === concepto)
    .reduce((s, d) => s + d.TOTAL, 0);
}

function fmt(v) {
  if (v === null || v === undefined) return '<span class="zero-num">—</span>';
  const abs = Math.abs(v);
  let s;
  if (abs >= 1e6) s = (v/1e6).toFixed(1).replace('.',',') + 'M';
  else if (abs >= 1e3) s = (v/1e3).toFixed(0) + 'K';
  else s = v.toFixed(0);
  const cls = v > 0 ? 'pos-num' : v < 0 ? 'neg-num' : 'zero-num';
  return `<span class="${cls}">$${s}</span>`;
}
function fmtFull(v) {
  if (v === null || v === undefined) return '—';
  return '$ ' + Math.round(v).toLocaleString('es-AR');
}
function fmtPct(v) { return `<span class="perc-cell">${(v*100).toFixed(1).replace('.',',')}%</span>`; }

function render() {

  const isTodas = tiendas.length === TIENDAS.length;

  // KPIs
  const totalVenta = activeMeses.reduce((s,m) => s + getVal(tiendas, m, 'Venta_sin_imp'), 0);

  const totalVentaCI = activeMeses.reduce((s,m) => s + getVal(tiendas, m, 'Venta_con_imp'), 0);
  const totalCostoKPI = activeMeses.reduce((s,m) => s + getVal(tiendas, m, 'Costo'), 0);
  const mbPct = totalVenta > 0 ? 1 - (totalCostoKPI / totalVenta) : 0;

    <div class="kpi"><div class="kpi-label">Resultado final</div><div class="kpi-val ${totalResult>=0?'pos':'neg'}">${fmtFull(totalResult)}</div><div class="kpi-sub">${activeMeses.length} mes${activeMeses.length>1?'es':''} acumulado</div></div>
    <div class="kpi"><div class="kpi-label">Tiendas analizadas</div><div class="kpi-val neutral">${tiendas.length}</div><div class="kpi-sub">${isTodas ? 'todas' : tiendas.join(', ').substring(0, 40)}</div></div>
  `;

  // TABLE
  const cols = activeMeses;
  const hasTotal = cols.length > 1;
  const dataCols = cols.length + (hasTotal ? 1 : 0);
  const totalTdCols = 1 + dataCols * 2; // concepto + (meses+total) * 2 columnas

  // Venta c/imp por mes y total para calcular %

  cols.forEach((m, i) => thead += `<th colspan="2" class="m-start${mCls(i)}">${MESES_LABELS[m]}</th>`);
  if (hasTotal) thead += '<th colspan="2" class="m-start m-total">Total</th>';
  thead += '</tr></thead>';

  let tbody = '<tbody>';
  SECTIONS.forEach(sec => {
    if (sec.showPct) {
      // Encabezado de sección integrado con $ / % vta c/imp
      let ghRow = `<tr class="group-header exp-header"><td>${sec.title}</td>`;
      cols.forEach(() => { ghRow += '<td class="sub-th">$</td><td class="sub-th">% vta c/imp</td>'; });
      if (hasTotal) ghRow += '<td class="sub-th">$</td><td class="sub-th">% vta c/imp</td>';
      ghRow += '</tr>';
      tbody += ghRow;
    } else {
      tbody += `<tr class="group-header"><td colspan="${totalTdCols}">${sec.title}</td></tr>`;
    }
    sec.rows.forEach(row => {
      const vals = cols.map(m => {
        if (row.key === 'Margen_bruto_porc') {
          const costo = getVal(tiendas, m, 'Costo');
          const vta = getVal(tiendas, m, 'Venta_sin_imp');
          return vta !== 0 ? 1 - (costo / vta) : 0;
        }
        return getVal(tiendas, m, row.key);
      });
      const anyNonZero = vals.some(v => v !== 0);
      if (!anyNonZero && row.type === 'detail') return;

      tbody += `<tr class="${row.type}"><td>${row.label}</td>`;
      vals.forEach((v, i) => {
        const m = cols[i];
        const mc = mCls(i);
        const ms = ` m-start${mc}`;
        if (row.type === 'perc') {
          tbody += `<td class="${'m-start'+mc}">${fmtPct(v)}</td><td class="${mc.trim()}"></td>`;
        } else if (sec.showPct) {
          if (row.type === 'result-final') {
            tbody += `<td class="${v>=0?'pos':'neg'}${ms}">${fmtFull(v)}</td><td class="${mc.trim()}"></td>`;
          } else if (row.type === 'result-op') {
            tbody += `<td class="${ms.trim()}">${fmt(v)}</td><td class="${mc.trim()}"></td>`;
          } else {
            tbody += `<td class="${ms.trim()}">${fmt(v)}</td>`;
            tbody += cellPct(v, vciByMonth[m], row.type, mc);
          }
        } else {
          if (row.type === 'result-final') {
            tbody += `<td class="${v>=0?'pos':'neg'}${ms}">${fmtFull(v)}</td><td class="${mc.trim()}"></td>`;
          } else {
            tbody += `<td class="${ms.trim()}">${fmt(v)}</td><td class="${mc.trim()}"></td>`;
          }
        }
      });
      if (hasTotal) {
        let total;
        if (row.key === 'Margen_bruto_porc') {
          const totalCosto = cols.reduce((s,m) => s + getVal(tiendas, m, 'Costo'), 0);
          const totalVta = cols.reduce((s,m) => s + getVal(tiendas, m, 'Venta_sin_imp'), 0);
          total = totalVta !== 0 ? 1 - (totalCosto / totalVta) : 0;
        } else {
          total = vals.reduce((s,v) => s + v, 0);
        }
        if (row.type === 'perc') {
          tbody += `<td class="m-start m-total">${fmtPct(total)}</td><td class="m-total"></td>`;
        } else if (sec.showPct) {
          if (row.type === 'result-final') {
            tbody += `<td class="${total>=0?'pos':'neg'} m-start m-total">${fmtFull(total)}</td><td class="m-total"></td>`;
          } else if (row.type === 'result-op') {
            tbody += `<td class="m-start m-total">${fmt(total)}</td><td class="m-total"></td>`;
          } else {
            tbody += `<td class="m-start m-total">${fmt(total)}</td>`;
            tbody += cellPct(total, vciTotal, row.type, ' m-total');
          }
        } else {
          if (row.type === 'result-final') {
            tbody += `<td class="${total>=0?'pos':'neg'} m-start m-total">${fmtFull(total)}</td><td class="m-total"></td>`;
          } else {
            tbody += `<td class="m-start m-total">${fmt(total)}</td><td class="m-total"></td>`;
          }
        }
      }
      tbody += '</tr>';
    });
  });
  tbody += '</tbody>';

  document.getElementById('pnl-table').innerHTML = thead + tbody;
  const titleLabel = isTodas ? 'Todas las tiendas' : tiendas.length === 1 ? tiendas[0] : `${tiendas.length} tiendas seleccionadas`;
  document.getElementById('table-title').textContent = `Estado de Resultados — ${titleLabel}`;

  // CHARTS
  destroyCharts();
  renderCharts(tiendas, activeMeses, isTodas);
}

function renderCharts(tiendas, meses, isTodas) {
  const gridColor = 'rgba(0,0,0,0.07)';
  const tickColor = '#374151';

  // Layout: charts 3+4 side by side only when NOT todas
  document.getElementById('breakdown-row-inner').classList.toggle('side-by-side', !isTodas);

  if (isTodas) {
    document.getElementById('chart-title').textContent = 'Resultados por tienda';
    // Chart 1: Resultado final por tienda
    const resultData = TIENDAS.map(t => meses.reduce((s,m) => s + getVal([t],m,'Resultado final'),0));
    charts.result = new Chart(document.getElementById('chart-result'), {
      type: 'bar',
      data: { labels: TIENDAS, datasets: [{ label:'Resultado final', data: resultData, backgroundColor: resultData.map(v => v >= 0 ? 'rgba(52,211,153,.7)' : 'rgba(248,113,113,.7)'), borderRadius: 4 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, title:{display:true, text:'Resultado Final por Tienda', color:'#111827', font:{size:12}}}, scales:{x:{ticks:{color:tickColor,font:{size:10}},grid:{color:gridColor}},y:{ticks:{color:tickColor,callback:v=>'$'+(v/1e6).toFixed(1).replace('.',',')+'M'},grid:{color:gridColor}}} }
    });
    // Chart 2: Margen bruto % por tienda
    const mbData = TIENDAS.map(t => {
      const mb = meses.reduce((s,m)=>s+getVal([t],m,'Margen_bruto_valor'),0);
      const vta = meses.reduce((s,m)=>s+getVal([t],m,'Venta_sin_imp'),0);
      return vta > 0 ? (mb/vta)*100 : 0;
    });
    charts.margen = new Chart(document.getElementById('chart-margen'), {
      type: 'bar',
      data: { labels: TIENDAS, datasets:[{ label:'Margen bruto %', data:mbData, backgroundColor:'rgba(0,83,99,.75)', borderRadius:4 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, title:{display:true, text:'Margen Bruto % por Tienda', color:'#111827', font:{size:12}}}, scales:{x:{ticks:{color:tickColor,font:{size:10}},grid:{color:gridColor}},y:{ticks:{color:tickColor,callback:v=>v.toFixed(0)+'%'},grid:{color:gridColor},max:100}} }
    });
    // Chart 3: Cascada de resultados
    const labels = ['Venta s/imp','– Costos','Margen bruto','– Gs. Operativos','– Gs. Financieros','– Sueldos','Res. Operativo','– IIBB','Resultado final'];
    const vta = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Venta_sin_imp'),0),0);
    const costo = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Costo'),0),0);
    const mb = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Margen_bruto_valor'),0),0);
    const gsOp = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Subtotal_gastos'),0),0);
    const gsFin = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Subtotal_gastos_financieros'),0),0);
    const suel = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Subtotal_sueldos'),0),0);
    const resOp = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Resultado operativo'),0),0);
    const iibb = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'IIBB'),0),0);
    const resFin = tiendas.reduce((s,t)=>s+meses.reduce((ss,m)=>ss+getVal([t],m,'Resultado final'),0),0);
    const waterfallData = [vta, costo, mb, gsOp, gsFin, suel, resOp, iibb, resFin];
    const waterfallColors = ['rgba(0,122,143,.8)','rgba(248,113,113,.8)','rgba(52,211,153,.8)','rgba(248,113,113,.8)','rgba(248,113,113,.8)','rgba(248,113,113,.8)','rgba(251,191,36,.8)','rgba(248,113,113,.8)', resFin>=0?'rgba(52,211,153,.9)':'rgba(248,113,113,.9)'];
    charts.breakdown = new Chart(document.getElementById('chart-breakdown'), {
      type: 'bar',
      data: { labels, datasets:[{ label:'$ Total', data:waterfallData, backgroundColor:waterfallColors, borderRadius:4 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, title:{display:true, text:'Cascada de resultados — acumulado', color:'#111827', font:{size:12}}}, scales:{x:{ticks:{color:tickColor,font:{size:11}},grid:{color:gridColor}},y:{ticks:{color:tickColor,callback:v=>'$'+(v/1e6).toFixed(1).replace('.',',')+'M'},grid:{color:gridColor}}} }
    });
  } else {
    // Chart 1: Ventas vs egresos por mes
    document.getElementById('chart-title').textContent = tiendas.length === 1 ? `Comparativa mensual — ${tiendas[0]}` : `Comparativa mensual — ${tiendas.length} tiendas`;
    const mesLabels = meses.map(m => MESES_LABELS[m]);
    const vtas = meses.map(m => getVal(tiendas, m, 'Venta_sin_imp'));
    const costos = meses.map(m => getVal(tiendas,m,'Subtotal_gastos') + getVal(tiendas,m,'Subtotal_gastos_financieros') + getVal(tiendas,m,'Subtotal_sueldos'));
    charts.result = new Chart(document.getElementById('chart-result'), {
      type: 'bar',
      data: { labels: mesLabels, datasets:[
        { label:'Venta s/imp', data:vtas, backgroundColor:'rgba(0,122,143,.7)', borderRadius:4 },
        { label:'Total egresos', data:costos, backgroundColor:'rgba(248,113,113,.7)', borderRadius:4 },
      ]},
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#111827',font:{size:11}}}, title:{display:true, text:'Ventas vs Egresos', color:'#111827', font:{size:12}}}, scales:{x:{ticks:{color:tickColor},grid:{color:gridColor}},y:{ticks:{color:tickColor,callback:v=>'$'+(v/1e6).toFixed(1).replace('.',',')+'M'},grid:{color:gridColor}}} }
    });
    // Chart 2: Resultado final por mes
    const results = meses.map(m => getVal(tiendas, m, 'Resultado final'));
    charts.margen = new Chart(document.getElementById('chart-margen'), {
      type: 'bar',
      data: { labels: mesLabels, datasets:[{ label:'Resultado final', data:results, backgroundColor:results.map(v=>v>=0?'rgba(52,211,153,.8)':'rgba(248,113,113,.8)'), borderRadius:4 }]},
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, title:{display:true, text:'Resultado Final por Mes', color:'#111827', font:{size:12}}}, scales:{x:{ticks:{color:tickColor},grid:{color:gridColor}},y:{ticks:{color:tickColor,callback:v=>'$'+(v/1e6).toFixed(1).replace('.',',')+'M'},grid:{color:gridColor}}} }
    });
    // Chart 3: Doughnut composición egresos
    const gsOp2 = meses.reduce((s,m)=>s+getVal(tiendas,m,'Subtotal_gastos'),0);
    const gsFin2 = meses.reduce((s,m)=>s+getVal(tiendas,m,'Subtotal_gastos_financieros'),0);
    const suel2 = meses.reduce((s,m)=>s+getVal(tiendas,m,'Subtotal_sueldos'),0);
    const csto2 = meses.reduce((s,m)=>s+getVal(tiendas,m,'Costo'),0);
    const imp2 = meses.reduce((s,m)=>s+getVal(tiendas,m,'Subtotal_impuestos'),0);
    const alqExp2 = meses.reduce((s,m)=>s+getVal(tiendas,m,'Alquiler')+getVal(tiendas,m,'Expensas'),0);
    const gsOpResto2 = Math.max(0, gsOp2 - alqExp2);

    const dnutLabels = ['Costo mercadería','Alquiler+Expensas','Gs. Operativos','Gs. Financieros','Sueldos','Impuestos'];
    const dnutData   = [csto2, alqExp2, gsOpResto2, gsFin2, suel2, imp2];
    const dnutColors = ['rgba(0,122,143,.8)','rgba(251,146,60,.8)','rgba(251,191,36,.8)','rgba(167,139,250,.8)','rgba(52,211,153,.8)','rgba(248,113,113,.8)'];

    charts.breakdown = new Chart(document.getElementById('chart-breakdown'), {
      type: 'doughnut',
      plugins: [ChartDataLabels],
      data: { labels: dnutLabels, datasets: [{ data: dnutData, backgroundColor: dnutColors, borderWidth: 0 }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 50, bottom: 55, left: 85, right: 85 } },
        plugins: {
          legend: { display: false },
          title: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
                const pct = (ctx.raw/total*100).toFixed(1).replace('.',',');
                return ` ${ctx.label}: ${pct}% ($${Math.round(ctx.raw).toLocaleString('es-AR')})`;
              }
            }
          },
          datalabels: {
            anchor: 'end',
            align: 'end',
            offset: 10,
            display: true,
            color: '#111827',
            textAlign: 'center',
            font: { size: 10, weight: 'bold' },
            backgroundColor: ctx => ctx.dataset.backgroundColor[ctx.dataIndex],
            borderRadius: 3,
            padding: { top: 3, bottom: 3, left: 5, right: 5 },
            formatter: (value, ctx) => {
              const total = ctx.dataset.data.reduce((a,b)=>a+b,0);
              const pct = (value/total*100).toFixed(1).replace('.',',');
              return ctx.chart.data.labels[ctx.dataIndex] + '\n' + pct + '%';
            }
          }
        }
      }
    });
  }

  // Chart 4: 100% barras apiladas — distribución de gastos (siempre visible)
  const GS_ITEMS = [
    { key: 'Alquiler',          label: 'Alquiler',        color: 'rgba(0,122,143,.85)'   },
    { key: 'Expensas',          label: 'Expensas',        color: 'rgba(167,139,250,.85)' },
    { key: 'Administración',    label: 'Administración',  color: 'rgba(251,191,36,.85)'  },
    { key: 'Logística',         label: 'Logística',       color: 'rgba(52,211,153,.85)'  },
    { key: 'Edesur',            label: 'Edesur',          color: 'rgba(248,113,113,.85)' },
    { key: 'ABL',               label: 'ABL',             color: 'rgba(45,212,191,.85)'  },
    { key: 'AYSA',              label: 'AYSA',            color: 'rgba(251,146,60,.85)'  },
    { key: 'Internet',          label: 'Internet',        color: 'rgba(99,202,255,.85)'  },
    { key: 'Mantenimiento',     label: 'Mantenimiento',   color: 'rgba(232,121,249,.85)' },
    { key: 'Packaging',         label: 'Packaging',       color: 'rgba(163,230,53,.85)'  },
    { key: 'Fumigación',        label: 'Fumigación',      color: 'rgba(253,224,71,.8)'   },
    { key: 'Alarma',            label: 'Alarma',          color: 'rgba(134,239,172,.8)'  },
    { key: 'Matafuegos',        label: 'Matafuegos',      color: 'rgba(253,186,116,.8)'  },
    { key: 'Servicios',         label: 'Servicios',       color: 'rgba(129,140,248,.85)' },
    { key: 'Multa',             label: 'Multa',           color: 'rgba(244,114,182,.85)' },
    { key: 'Otros gastos',      label: 'Otros gastos',    color: 'rgba(148,163,184,.8)'  },
    { key: 'Subtotal_sueldos',  label: 'Sueldos',         color: 'rgba(239,68,68,.85)'   },
  ];

  // Calcular valores brutos por tienda
  const rawItems = GS_ITEMS
    .map(item => ({
      key: item.key,
      label: item.label,
      color: item.color,
      data: tiendas.map(t => meses.reduce((s,m) => s + getVal([t], m, item.key), 0)),
    }))
    .filter(item => item.data.some(v => v > 0));

  // Ordenar de mayor a menor (el más grande va al fondo de la barra)
  rawItems.sort((a, b) => b.data.reduce((s,v)=>s+v,0) - a.data.reduce((s,v)=>s+v,0));

  // Totales por tienda para normalizar a 100%
  const tiendaTotals = tiendas.map((_, i) => rawItems.reduce((s, item) => s + item.data[i], 0));

  const stackDatasets = rawItems.map(item => ({
    label: item.label,
    rawData: item.data,
    data: item.data.map((v, i) => tiendaTotals[i] > 0 ? parseFloat((v / tiendaTotals[i] * 100).toFixed(2)) : 0),
    backgroundColor: item.color,
    borderWidth: 0,
  }));

  charts.gastosStack = new Chart(document.getElementById('chart-gastos-stack'), {
    type: 'bar',
    data: { labels: tiendas, datasets: stackDatasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'right',
          reverse: true, // leyenda de abajo a arriba igual que el gráfico
          labels: { color: '#111827', font: { size: 11 }, boxWidth: 12 }
        },
        title: { display: true, text: 'Distribución de gastos', color: '#111827', font: { size: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const raw = ctx.dataset.rawData[ctx.dataIndex];
              const pct = ctx.parsed.y.toFixed(1).replace('.', ',');
              return ` ${ctx.dataset.label}: ${pct}% ($${Math.round(raw).toLocaleString('es-AR')})`;
            }
          }
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: tickColor, font: { size: 11 } }, grid: { color: gridColor } },
        y: { stacked: true, max: 100, ticks: { color: tickColor, callback: v => v + '%' }, grid: { color: gridColor } }
      }
    }
  });
}

function setView(v) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&v==='tabla')||(i===1&&v==='graficos')));
  document.getElementById('view-tabla').style.display = v === 'tabla' ? 'block' : 'none';
  document.getElementById('view-graficos').style.display = v === 'graficos' ? 'block' : 'none';
  if (v === 'graficos') { destroyCharts(); const t=[...selectedTiendas]; const m=[...selectedMeses].sort((a,b)=>a-b); renderCharts(t, m, t.length===TIENDAS.length); }
}

function downloadExcel() {
  const tiendas = [...selectedTiendas];
  const activeMeses = [...selectedMeses].sort((a,b)=>a-b);
  const isTodas = tiendas.length === TIENDAS.length;

  const wb = XLSX.utils.book_new();

  const header = ['Concepto', ...activeMeses.map(m => MESES_LABELS[m])];
  if (activeMeses.length > 1) header.push('Total');

  const rows = [header];

  SECTIONS.forEach(sec => {
    rows.push([sec.title]);
    sec.rows.forEach(row => {
      const vals = activeMeses.map(m => {
        if (row.key === 'Margen_bruto_porc') {
          const costo = getVal(tiendas, m, 'Costo');
          const vta = getVal(tiendas, m, 'Venta_sin_imp');
          return vta !== 0 ? 1 - (costo / vta) : 0;
        }
        return getVal(tiendas, m, row.key);
      });
      const anyNonZero = vals.some(v => v !== 0);
      if (!anyNonZero && row.type === 'detail') return;

      const rowData = [row.label];
      vals.forEach(v => {
        if (row.type === 'perc') rowData.push(parseFloat((v * 100).toFixed(2)) / 100);
        else rowData.push(parseFloat(v.toFixed(2)));
      });
      if (activeMeses.length > 1) {
        let total;
        if (row.key === 'Margen_bruto_porc') {
          const totalCosto = activeMeses.reduce((s,m) => s + getVal(tiendas, m, 'Costo'), 0);
          const totalVta = activeMeses.reduce((s,m) => s + getVal(tiendas, m, 'Venta_sin_imp'), 0);
          total = totalVta !== 0 ? 1 - (totalCosto / totalVta) : 0;
          rowData.push(parseFloat(total.toFixed(4)));
        } else {
          total = vals.reduce((s, v) => s + v, 0);
          rowData.push(parseFloat(total.toFixed(2)));
        }
      }
      rows.push(rowData);
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 28 }, ...activeMeses.map(() => ({ wch: 16 })), { wch: 16 }];

  const sheetName = isTodas ? 'Todas las tiendas' : tiendas[0].substring(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const fileName = `El_Lucero_${isTodas ? 'Todas' : tiendas.length === 1 ? tiendas[0].replace(/ /g,'_') : `${tiendas.length}_tiendas`}.xlsx`;
  XLSX.writeFile(wb, fileName);
}

render();
</script>
